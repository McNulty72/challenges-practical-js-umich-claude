<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch with laps</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="watch-container">
      <div class="watch-hours"><span>00</span></div>
      <div class="watch-minutes"><span>00</span></div>
      <div class="watch-seconds"><span>00</span></div>
      <div class="watch-hundredths"><span>00</span></div>
    </div>
    <div class="buttons-container">
      <button class="lap-btn" disabled>
        <span class="lap-btn-text">Lap</span>
      </button>
      <button class="start-btn">
        <span class="start-btn-text">Start</span>
      </button>
    </div>
    <div class="laps-container-header">
      <div class="laps-head">
        <span>Lap</span>
        <span>Lap time</span>
        <span>Total time</span>
      </div>
    </div>
    <div class="laps-container"></div>
    <script src="script.js"></script>
  </body>
</html>
