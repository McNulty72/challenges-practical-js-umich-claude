<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank transactions table with events delegation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <h2>Add new transactions</h2>
      <section>
        <fieldset>
          <legend>Transaction details</legend>
          <label for="date">Date:</label>
          <input type="date" id="date" name="date" />
          <fieldset id="transaction-type">
            <legend>Transaction type</legend>
            <label for="salary"
              ><input
                type="radio"
                id="salary"
                name="transaction-type"
                value="salary"
                required
              />Salary</label
            >

            <label for="credit"
              ><input
                type="radio"
                id="credit"
                name="transaction-type"
                value="credit"
              />Credit</label
            >

            <label for="debit"
              ><input
                type="radio"
                id="debit"
                name="transaction-type"
                value="debit"
              />Debit</label
            >
          </fieldset>
          <label for="description">Description:</label>
          <input
            type="text"
            id="description"
            name="description"
            maxlength="60"
            required="required"
          />
          <label for="amount">Amount:</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="0"
            step="0.01"
            required="required"
            disabled
          />
        </fieldset>
      </section>
      <section class="form-buttons">
        <div class="insufficient-funds" hidden>
          <h3>Insufficient available balance</h3>
          <p>This transaction exceeds your available balance.</p>
        </div>
        <p>
          <button type="submit" class="submit-btn">Add transaction</button>
        </p>
      </section>
    </form>
    <script src="script.js"></script>
  </body>
</html>
